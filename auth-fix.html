<!DOCTYPE html>
<html>
<head>
    <title>Quick Auth Fix</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Quick Authentication Fix</h1>
    
    <div class="section">
        <h2>Current Authentication Status</h2>
        <div id="authStatus"></div>
    </div>
    
    <div class="section">
        <h2>Quick Fixes</h2>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="setMockToken()">Set Mock Token</button>
        <button onclick="clearAuth()">Clear Auth</button>
        <button onclick="testAPI()">Test API</button>
    </div>
    
    <div class="section">
        <h2>Results</h2>
        <div id="results"></div>
    </div>

    <script>
        function log(message, isError = false) {
            const div = document.getElementById('results');
            div.innerHTML += `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
        }
        
        function checkAuthStatus() {
            const authToken = localStorage.getItem('auth_token');
            const div = document.getElementById('authStatus');
            
            if (authToken) {
                div.innerHTML = `<div class="success">Token found: ${authToken.substring(0, 20)}...</div>`;
            } else {
                div.innerHTML = `<div class="error">No auth token found</div>`;
            }
        }
        
        async function testLogin() {
            log('Attempting to login with default credentials...');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('auth_token', data.access);
                    log('✅ Login successful! Token saved.');
                    checkAuthStatus();
                } else {
                    const errorData = await response.json();
                    log(`❌ Login failed: ${response.status} - ${JSON.stringify(errorData)}`, true);
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, true);
            }
        }
        
        function setMockToken() {
            // Set a mock token for testing (this won't work but will show us the flow)
            localStorage.setItem('auth_token', 'mock-token-for-testing');
            log('Mock token set (for testing flow only)');
            checkAuthStatus();
        }
        
        function clearAuth() {
            localStorage.removeItem('auth_token');
            log('Authentication cleared');
            checkAuthStatus();
        }
        
        async function testAPI() {
            const authToken = localStorage.getItem('auth_token');
            
            if (!authToken) {
                log('❌ No auth token to test with', true);
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/shop/appointments/', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ API test successful! Found ${data.count || 0} appointments`);
                    if (data.results && data.results.length > 0) {
                        log(`Sample appointment: ${JSON.stringify(data.results[0], null, 2)}`);
                    }
                } else {
                    log(`❌ API test failed: ${response.status} ${response.statusText}`, true);
                }
            } catch (error) {
                log(`❌ API test error: ${error.message}`, true);
            }
        }
        
        // Initial check
        checkAuthStatus();
    </script>
</body>
</html>
