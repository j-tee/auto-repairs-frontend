<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Assignment API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Direct Assignment API Test</h1>
    
    <div>
        <button onclick="login()">1. Login as Owner</button>
        <button onclick="getAppointments()">2. Get Appointments</button>
        <button onclick="getTechnicians()">3. Get Technicians</button>
        <button onclick="testAssignment()">4. Test Assignment</button>
        <button onclick="verifyInDatabase()">5. Verify in Database</button>
    </div>

    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let authToken = null;
        let appointments = [];
        let technicians = [];
        let testAppointmentId = null;
        let testTechnicianId = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }

        function logJSON(data, label) {
            log(`${label}:<pre>${JSON.stringify(data, null, 2)}</pre>`);
        }

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                ...options
            });

            let data;
            try {
                data = await response.json();
            } catch (e) {
                data = await response.text();
            }

            return { response, data };
        }

        async function login() {
            try {
                log('🔐 Logging in as owner...');
                
                const { response, data } = await apiCall('/auth/login/', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: 'owner@autorepairshop.com',
                        password: 'owner123'
                    })
                });

                if (response.ok) {
                    authToken = data.access;
                    log(`✅ Login successful as ${data.user.role}`, 'success');
                } else {
                    log(`❌ Login failed: ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }

        async function getAppointments() {
            try {
                log('📋 Getting appointments...');
                
                const { response, data } = await apiCall('/shop/appointments/');
                
                if (response.ok) {
                    appointments = Array.isArray(data) ? data : (data.results || []);
                    log(`✅ Found ${appointments.length} appointments`, 'success');
                    
                    // Find a pending appointment
                    const pending = appointments.find(apt => apt.status === 'pending' && !apt.assigned_technician_id);
                    if (pending) {
                        testAppointmentId = pending.id;
                        log(`🎯 Using appointment ${pending.id} for testing (Status: ${pending.status})`, 'info');
                        logJSON(pending, 'Test Appointment Details');
                    } else {
                        log('⚠️ No pending appointments found for testing', 'error');
                        if (appointments.length > 0) {
                            logJSON(appointments[0], 'Sample Appointment');
                        }
                    }
                } else {
                    log(`❌ Failed to get appointments: ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error getting appointments: ${error.message}`, 'error');
            }
        }

        async function getTechnicians() {
            try {
                log('👨‍🔧 Getting technicians...');
                
                const { response, data } = await apiCall('/shop/employees/?role=technician');
                
                if (response.ok) {
                    technicians = Array.isArray(data) ? data : (data.results || []);
                    log(`✅ Found ${technicians.length} technicians`, 'success');
                    
                    if (technicians.length > 0) {
                        testTechnicianId = technicians[0].id;
                        log(`🎯 Using technician ${technicians[0].id} (${technicians[0].name || technicians[0].first_name}) for testing`, 'info');
                        logJSON(technicians[0], 'Test Technician Details');
                    } else {
                        log('⚠️ No technicians found', 'error');
                    }
                } else {
                    log(`❌ Failed to get technicians: ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Error getting technicians: ${error.message}`, 'error');
            }
        }

        async function testAssignment() {
            if (!testAppointmentId || !testTechnicianId) {
                log('❌ Missing appointment or technician ID. Run steps 2 and 3 first.', 'error');
                return;
            }

            try {
                log(`🎯 Testing assignment: Appointment ${testAppointmentId} → Technician ${testTechnicianId}`);
                
                // Test the PATCH method that the frontend uses
                const { response, data } = await apiCall(`/shop/appointments/${testAppointmentId}/`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        assigned_technician_id: testTechnicianId,
                        status: 'assigned'
                    })
                });

                if (response.ok) {
                    log('✅ Assignment successful!', 'success');
                    logJSON(data, 'Assignment Response');
                } else {
                    log(`❌ Assignment failed: HTTP ${response.status}`, 'error');
                    logJSON(data, 'Error Response');
                }
            } catch (error) {
                log(`❌ Assignment error: ${error.message}`, 'error');
            }
        }

        async function verifyInDatabase() {
            if (!testAppointmentId) {
                log('❌ No test appointment ID available', 'error');
                return;
            }

            try {
                log(`🔍 Verifying appointment ${testAppointmentId} in database...`);
                
                const { response, data } = await apiCall(`/shop/appointments/${testAppointmentId}/`);
                
                if (response.ok) {
                    log(`✅ Current appointment data:`, 'success');
                    logJSON(data, 'Database State');
                    
                    if (data.assigned_technician_id) {
                        log(`🎯 Technician ${data.assigned_technician_id} is assigned (Status: ${data.status})`, 'success');
                    } else {
                        log(`❌ No technician assigned in database`, 'error');
                    }
                } else {
                    log(`❌ Failed to verify: HTTP ${response.status}`, 'error');
                    logJSON(data, 'Error Response');
                }
            } catch (error) {
                log(`❌ Verification error: ${error.message}`, 'error');
            }
        }

        // Auto-run login
        window.addEventListener('load', () => {
            log('🚀 Ready to test assignment API');
        });
    </script>
</body>
</html>
