<!DOCTYPE html>
<html>
<head>
    <title>Auth Status Debug</title>
</head>
<body>
    <h1>Authentication Status Debug</h1>
    <div id="output"></div>
    
    <script>
        function debugAuthStatus() {
            const output = document.getElementById('output');
            
            // Check localStorage
            const token = localStorage.getItem('auth_token');
            const refreshToken = localStorage.getItem('refreshToken');
            const user = localStorage.getItem('user');
            
            let html = `
                <h2>LocalStorage Status:</h2>
                <p><strong>Auth Token:</strong> ${token ? 'Present' : 'Missing'}</p>
                <p><strong>Refresh Token:</strong> ${refreshToken ? 'Present' : 'Missing'}</p>
                <p><strong>User Data:</strong> ${user ? 'Present' : 'Missing'}</p>
                
                ${token ? `<p><strong>Token Preview:</strong> ${token.substring(0, 50)}...</p>` : ''}
                ${user ? `<p><strong>User Data:</strong> <pre>${JSON.stringify(JSON.parse(user), null, 2)}</pre></p>` : ''}
                
                <h2>Test API Call:</h2>
                <button onclick="testApiCall()">Test Admin Users Endpoint</button>
                <div id="apiResult"></div>
            `;
            
            output.innerHTML = html;
        }
        
        async function testApiCall() {
            const resultDiv = document.getElementById('apiResult');
            const token = localStorage.getItem('auth_token');
            
            if (!token) {
                resultDiv.innerHTML = '<p style="color: red;">No token found</p>';
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/admin/users/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const responseText = await response.text();
                
                resultDiv.innerHTML = `
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${responseText}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Run debug on load
        debugAuthStatus();
    </script>
</body>
</html>
