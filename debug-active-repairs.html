<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Active Repairs API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Debug Active Repairs API</h1>
    
    <div>
        <button onclick="testActiveRepairsAPI()">Test Active Repairs Endpoint</button>
        <button onclick="testRegularRepairsAPI()">Test Regular Repairs Endpoint</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';
        const results = document.getElementById('results');

        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `
                <h3>${title}</h3>
                <pre>${content}</pre>
            `;
            results.appendChild(div);
        }

        function clearResults() {
            results.innerHTML = '';
        }

        async function testActiveRepairsAPI() {
            try {
                addResult('Testing Active Repairs Endpoint...', 'Fetching data from /api/shop/repair-orders/active/');
                
                const response = await fetch(`${API_BASE_URL}/shop/repair-orders/active/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // Note: In real app, you'd include: 'Authorization': 'Bearer ' + token
                    }
                });

                const responseText = await response.text();
                
                if (!response.ok) {
                    addResult(`❌ HTTP Error ${response.status}`, responseText, true);
                    return;
                }

                try {
                    const data = JSON.parse(responseText);
                    addResult('✅ Active Repairs Response', JSON.stringify(data, null, 2));
                    
                    if (Array.isArray(data) && data.length > 0) {
                        addResult('🔍 First Item Structure', JSON.stringify(data[0], null, 2));
                        
                        // Check for the fields we're expecting
                        const firstItem = data[0];
                        const analysis = {
                            hasId: !!firstItem.id,
                            hasDescription: !!firstItem.description,
                            hasOrderNumber: !!firstItem.orderNumber,
                            hasVehicle: !!firstItem.vehicle,
                            vehicleStructure: firstItem.vehicle || 'Not present',
                            hasCustomer: !!firstItem.customer,
                            customerStructure: firstItem.customer || 'Not present',
                            allFields: Object.keys(firstItem)
                        };
                        
                        addResult('📊 Field Analysis', JSON.stringify(analysis, null, 2));
                    } else {
                        addResult('ℹ️ Empty Response', 'No active repair orders found');
                    }
                } catch (parseError) {
                    addResult('❌ JSON Parse Error', `Could not parse response as JSON: ${parseError.message}\n\nRaw response:\n${responseText}`, true);
                }
            } catch (error) {
                addResult('❌ Network Error', `${error.message}`, true);
            }
        }

        async function testRegularRepairsAPI() {
            try {
                addResult('Testing Regular Repairs Endpoint...', 'Fetching data from /api/shop/repair-orders/ (first 5)');
                
                const response = await fetch(`${API_BASE_URL}/shop/repair-orders/?limit=5`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const responseText = await response.text();
                
                if (!response.ok) {
                    addResult(`❌ HTTP Error ${response.status}`, responseText, true);
                    return;
                }

                try {
                    const data = JSON.parse(responseText);
                    addResult('✅ Regular Repairs Response', JSON.stringify(data, null, 2));
                } catch (parseError) {
                    addResult('❌ JSON Parse Error', `Could not parse response as JSON: ${parseError.message}\n\nRaw response:\n${responseText}`, true);
                }
            } catch (error) {
                addResult('❌ Network Error', `${error.message}`, true);
            }
        }

        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            addResult('🚀 Ready to test', 'Click the buttons above to test the API endpoints');
        });
    </script>
</body>
</html>
