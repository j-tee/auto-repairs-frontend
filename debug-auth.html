<!DOCTYPE html>
<html>
<head>
    <title>Debug Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .warning { background: #fff3cd; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Authentication & API Access</h1>
    
    <div class="section">
        <h2>LocalStorage Inspection</h2>
        <div id="localStorage"></div>
    </div>
    
    <div class="section">
        <h2>API Test Results</h2>
        <div id="apiResults"></div>
    </div>

    <script>
        // Check localStorage for auth tokens
        function checkLocalStorage() {
            const div = document.getElementById('localStorage');
            const keys = Object.keys(localStorage);
            
            if (keys.length === 0) {
                div.innerHTML = '<div class="error">No items in localStorage</div>';
                return;
            }
            
            let html = '<h3>LocalStorage Contents:</h3>';
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                html += `<div><strong>${key}:</strong> <code>${value}</code></div>`;
            });
            
            div.innerHTML = html;
            
            // Check for auth-related keys
            const authToken = localStorage.getItem('auth_token');
            const accessToken = localStorage.getItem('access_token');
            const token = localStorage.getItem('token');
            
            if (authToken || accessToken || token) {
                div.innerHTML += '<div class="success">✅ Authentication token found!</div>';
            } else {
                div.innerHTML += '<div class="error">❌ No authentication token found!</div>';
            }
        }
        
        // Test API with different auth approaches
        async function testAPI() {
            const resultsDiv = document.getElementById('apiResults');
            const API_BASE = 'http://127.0.0.1:8000/api';
            
            // Test 1: No auth
            try {
                const response = await fetch(`${API_BASE}/shop/appointments/`);
                resultsDiv.innerHTML += `
                    <div class="error">
                        <strong>Test 1 - No Auth:</strong> ${response.status} ${response.statusText}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="error">
                        <strong>Test 1 - No Auth:</strong> Error - ${error.message}
                    </div>
                `;
            }
            
            // Test 2: With auth token from localStorage
            const authToken = localStorage.getItem('auth_token') || 
                             localStorage.getItem('access_token') || 
                             localStorage.getItem('token');
            
            if (authToken) {
                try {
                    const response = await fetch(`${API_BASE}/shop/appointments/`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        resultsDiv.innerHTML += `
                            <div class="success">
                                <strong>Test 2 - With Auth:</strong> ${response.status} ${response.statusText}<br>
                                <strong>Data:</strong> <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    } else {
                        resultsDiv.innerHTML += `
                            <div class="warning">
                                <strong>Test 2 - With Auth:</strong> ${response.status} ${response.statusText}
                            </div>
                        `;
                    }
                } catch (error) {
                    resultsDiv.innerHTML += `
                        <div class="error">
                            <strong>Test 2 - With Auth:</strong> Error - ${error.message}
                        </div>
                    `;
                }
            } else {
                resultsDiv.innerHTML += `
                    <div class="warning">
                        <strong>Test 2 - With Auth:</strong> Skipped - No auth token found
                    </div>
                `;
            }
            
            // Test 3: Test other endpoints that might not require auth
            try {
                const response = await fetch(`${API_BASE}/shop/customers/`);
                resultsDiv.innerHTML += `
                    <div class="${response.ok ? 'success' : 'error'}">
                        <strong>Test 3 - Customers Endpoint:</strong> ${response.status} ${response.statusText}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="error">
                        <strong>Test 3 - Customers Endpoint:</strong> Error - ${error.message}
                    </div>
                `;
            }
        }
        
        // Run checks on page load
        checkLocalStorage();
        testAPI();
    </script>
</body>
</html>
