<!DOCTYPE html>
<html>
<head>
    <title>Manual Authentication Fix</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; width: 250px; border: 1px solid #ddd; border-radius: 3px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Manual Authentication Fix</h1>
    
    <div class="section">
        <h2>Login Credentials</h2>
        <input type="email" id="email" placeholder="Email" value="owner@autorepairshop.com">
        <input type="password" id="password" placeholder="Password" value="owner123">
        <button onclick="login()">Login</button>
    </div>
    
    <div class="section">
        <h2>Current Status</h2>
        <div id="status"></div>
    </div>
    
    <div class="section">
        <h2>Actions</h2>
        <button onclick="testAppointments()">Test Appointments API</button>
        <button onclick="checkLocalStorage()">Check LocalStorage</button>
        <button onclick="refreshDashboard()">Refresh Dashboard</button>
    </div>
    
    <div class="section">
        <h2>Results</h2>
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        function log(message, type = 'info') {
            const div = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            div.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
        }
        
        function updateStatus() {
            const authToken = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user');
            const statusDiv = document.getElementById('status');
            
            if (authToken) {
                statusDiv.innerHTML = `
                    <div class="success">✅ Authenticated</div>
                    <div>Token: ${authToken.substring(0, 30)}...</div>
                    <div>User: ${user ? JSON.parse(user).email : 'No user data'}</div>
                `;
            } else {
                statusDiv.innerHTML = `<div class="error">❌ Not authenticated</div>`;
            }
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            log('Attempting login...');
            
            try {
                const response = await fetch(`${API_BASE}/token/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Set tokens in localStorage (same as the frontend does)
                    localStorage.setItem('auth_token', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    
                    log('✅ Login successful! Tokens saved to localStorage.');
                    log(`Access token: ${data.access.substring(0, 50)}...`);
                    
                    // Try to get user profile
                    await getUserProfile(data.access);
                    
                    updateStatus();
                } else {
                    const errorData = await response.json();
                    log(`❌ Login failed: ${response.status} - ${JSON.stringify(errorData)}`, 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }
        
        async function getUserProfile(accessToken) {
            try {
                const response = await fetch(`${API_BASE}/auth/user/`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    
                    // Transform user data (same as frontend)
                    const user = {
                        id: userData.id.toString(),
                        email: userData.email,
                        username: userData.username,
                        firstName: userData.first_name,
                        lastName: userData.last_name,
                        role: userData.role,
                        isEmailVerified: userData.is_email_verified,
                        permissions: userData.permissions
                    };
                    
                    localStorage.setItem('user', JSON.stringify(user));
                    log(`✅ User profile saved: ${user.email} (${user.role})`);
                } else {
                    log(`⚠️ Could not fetch user profile: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`⚠️ User profile error: ${error.message}`, 'error');
            }
        }
        
        async function testAppointments() {
            const authToken = localStorage.getItem('auth_token');
            
            if (!authToken) {
                log('❌ No auth token found. Please login first.', 'error');
                return;
            }
            
            log('Testing appointments API...');
            
            try {
                const response = await fetch(`${API_BASE}/shop/appointments/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Appointments API successful! Found ${data.count || 0} appointments`);
                    
                    if (data.results && data.results.length > 0) {
                        log(`Sample appointments:<br><pre>${JSON.stringify(data.results, null, 2)}</pre>`);
                    }
                } else {
                    log(`❌ Appointments API failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Appointments API error: ${error.message}`, 'error');
            }
        }
        
        function checkLocalStorage() {
            const authToken = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user');
            const refreshToken = localStorage.getItem('refreshToken');
            
            log('LocalStorage contents:');
            log(`auth_token: ${authToken ? authToken.substring(0, 30) + '...' : 'None'}`);
            log(`user: ${user ? JSON.stringify(JSON.parse(user), null, 2) : 'None'}`);
            log(`refreshToken: ${refreshToken ? refreshToken.substring(0, 30) + '...' : 'None'}`);
        }
        
        function refreshDashboard() {
            log('Opening dashboard in new tab...');
            window.open('http://localhost:5174/dashboard', '_blank');
        }
        
        // Initial status check
        updateStatus();
    </script>
</body>
</html>
