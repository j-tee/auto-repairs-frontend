<!DOCTYPE html>
<html>
<head>
    <title>Check Token</title>
</head>
<body>
    <h1>Frontend Token Check</h1>
    <div id="result"></div>
    
    <script>
        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
        const result = document.getElementById('result');
        
        if (token) {
            result.innerHTML = `
                <p><strong>Token found:</strong></p>
                <p style="word-break: break-all; font-family: monospace; background: #f0f0f0; padding: 10px;">
                    ${token}
                </p>
                <p><strong>Length:</strong> ${token.length}</p>
            `;
        } else {
            result.innerHTML = '<p style="color: red;"><strong>No token found in localStorage</strong></p>';
        }
    </script>
</body>
</html>
