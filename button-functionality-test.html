<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 8px 16px; }
        pre { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔧 Technician Button Functionality Test</h1>
    
    <div class="test-section">
        <h2>Authentication</h2>
        <button onclick="login()">Login as Owner</button>
        <button onclick="logout()">Logout</button>
        <div id="authStatus"></div>
    </div>

    <div class="test-section">
        <h2>Backend API Tests</h2>
        <button onclick="testEmployees()">Test Employees Endpoint</button>
        <button onclick="testAppointments()">Test Appointments Endpoint</button>
        <div id="apiResults"></div>
    </div>

    <div class="test-section">
        <h2>Button Action Tests</h2>
        <button onclick="testAssignTechnician()">Test Assign Technician</button>
        <button onclick="testStartWork()">Test Start Work</button>
        <button onclick="testCompleteWork()">Test Complete Work</button>
        <div id="buttonResults"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let authToken = null;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            element.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
        }

        async function login() {
            try {
                log('authStatus', 'Attempting to login...', 'info');
                
                const response = await fetch(`${API_BASE}/token/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'owner@autorepairshop.com',
                        password: 'owner123'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Login failed: ${response.status}`);
                }

                const data = await response.json();
                authToken = data.access;
                
                log('authStatus', '✅ Login successful!', 'success');
                log('authStatus', `Token: ${authToken.substring(0, 50)}...`, 'info');
            } catch (error) {
                log('authStatus', `❌ Login error: ${error.message}`, 'error');
            }
        }

        function logout() {
            authToken = null;
            log('authStatus', '🚪 Logged out', 'info');
        }

        async function testEmployees() {
            if (!authToken) {
                log('apiResults', '❌ Please login first', 'error');
                return;
            }

            try {
                log('apiResults', 'Testing employees endpoint...', 'info');
                
                const response = await fetch(`${API_BASE}/shop/employees/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Employees API failed: ${response.status}`);
                }

                const data = await response.json();
                const technicians = data.filter(emp => emp.is_technician || emp.role === 'technician' || emp.role === 'mechanic');
                
                log('apiResults', `✅ Found ${data.length} employees, ${technicians.length} technicians`, 'success');
                log('apiResults', `Available technicians: ${technicians.filter(t => t.is_available).length}`, 'info');
                
                // Display technician details
                technicians.forEach(tech => {
                    log('apiResults', `- ${tech.name} (ID: ${tech.id}) - ${tech.is_available ? 'Available' : 'Busy'} - Workload: ${tech.workload_count}`, 'info');
                });
                
            } catch (error) {
                log('apiResults', `❌ Employees test error: ${error.message}`, 'error');
            }
        }

        async function testAppointments() {
            if (!authToken) {
                log('apiResults', '❌ Please login first', 'error');
                return;
            }

            try {
                log('apiResults', 'Testing appointments endpoint...', 'info');
                
                const response = await fetch(`${API_BASE}/shop/appointments/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Appointments API failed: ${response.status}`);
                }

                const data = await response.json();
                
                log('apiResults', `✅ Found ${data.length} appointments`, 'success');
                
                const statusCounts = data.reduce((acc, apt) => {
                    acc[apt.status] = (acc[apt.status] || 0) + 1;
                    return acc;
                }, {});
                
                log('apiResults', `Status breakdown: ${JSON.stringify(statusCounts)}`, 'info');
                
                // Find testable appointments
                const pendingAppts = data.filter(apt => apt.status === 'pending');
                const assignedAppts = data.filter(apt => apt.status === 'assigned');
                const inProgressAppts = data.filter(apt => apt.status === 'in_progress');
                
                if (pendingAppts.length > 0) {
                    window.testAppointmentId = pendingAppts[0].id;
                    log('apiResults', `📋 Test appointment for assignment: ID ${window.testAppointmentId}`, 'info');
                }
                
                if (assignedAppts.length > 0) {
                    window.assignedAppointmentId = assignedAppts[0].id;
                    log('apiResults', `🔧 Test appointment for start work: ID ${window.assignedAppointmentId}`, 'info');
                }
                
                if (inProgressAppts.length > 0) {
                    window.inProgressAppointmentId = inProgressAppts[0].id;
                    log('apiResults', `⚡ Test appointment for completion: ID ${window.inProgressAppointmentId}`, 'info');
                }
                
            } catch (error) {
                log('apiResults', `❌ Appointments test error: ${error.message}`, 'error');
            }
        }

        async function testAssignTechnician() {
            if (!authToken) {
                log('buttonResults', '❌ Please login first', 'error');
                return;
            }

            if (!window.testAppointmentId) {
                log('buttonResults', '❌ No pending appointment found. Run "Test Appointments" first.', 'error');
                return;
            }

            try {
                log('buttonResults', `Testing technician assignment for appointment ${window.testAppointmentId}...`, 'info');
                
                // First get available technicians
                const employeesResponse = await fetch(`${API_BASE}/shop/employees/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const employees = await employeesResponse.json();
                const availableTechnicians = employees.filter(emp => 
                    (emp.is_technician || emp.role === 'technician' || emp.role === 'mechanic') && 
                    emp.is_available
                );

                if (availableTechnicians.length === 0) {
                    log('buttonResults', '❌ No available technicians found', 'error');
                    return;
                }

                const technicianId = availableTechnicians[0].id;
                log('buttonResults', `Assigning technician ${availableTechnicians[0].name} (ID: ${technicianId})`, 'info');
                
                // Test the assignment using PATCH endpoint
                const response = await fetch(`${API_BASE}/shop/appointments/${window.testAppointmentId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        assigned_technician_id: technicianId,
                        status: 'assigned'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Assignment failed: ${response.status} - ${errorText}`);
                }

                const updatedAppointment = await response.json();
                log('buttonResults', '✅ Technician assignment successful!', 'success');
                log('buttonResults', `Status: ${updatedAppointment.status}`, 'info');
                
                // Update test appointment ID for next test
                window.assignedAppointmentId = window.testAppointmentId;
                window.testAppointmentId = null;
                
            } catch (error) {
                log('buttonResults', `❌ Assign technician error: ${error.message}`, 'error');
            }
        }

        async function testStartWork() {
            if (!authToken) {
                log('buttonResults', '❌ Please login first', 'error');
                return;
            }

            const appointmentId = window.assignedAppointmentId || window.testAppointmentId;
            if (!appointmentId) {
                log('buttonResults', '❌ No assigned appointment found. Run "Test Assign Technician" first.', 'error');
                return;
            }

            try {
                log('buttonResults', `Testing start work for appointment ${appointmentId}...`, 'info');
                
                const response = await fetch(`${API_BASE}/shop/appointments/${appointmentId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'in_progress'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Start work failed: ${response.status} - ${errorText}`);
                }

                const updatedAppointment = await response.json();
                log('buttonResults', '✅ Start work successful!', 'success');
                log('buttonResults', `Status: ${updatedAppointment.status}`, 'info');
                
                // Update test appointment ID for next test
                window.inProgressAppointmentId = appointmentId;
                window.assignedAppointmentId = null;
                
            } catch (error) {
                log('buttonResults', `❌ Start work error: ${error.message}`, 'error');
            }
        }

        async function testCompleteWork() {
            if (!authToken) {
                log('buttonResults', '❌ Please login first', 'error');
                return;
            }

            const appointmentId = window.inProgressAppointmentId || window.assignedAppointmentId || window.testAppointmentId;
            if (!appointmentId) {
                log('buttonResults', '❌ No in-progress appointment found. Run previous tests first.', 'error');
                return;
            }

            try {
                log('buttonResults', `Testing complete work for appointment ${appointmentId}...`, 'info');
                
                const response = await fetch(`${API_BASE}/shop/appointments/${appointmentId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'completed'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Complete work failed: ${response.status} - ${errorText}`);
                }

                const updatedAppointment = await response.json();
                log('buttonResults', '✅ Complete work successful!', 'success');
                log('buttonResults', `Status: ${updatedAppointment.status}`, 'info');
                
                // Clear test appointment IDs
                window.inProgressAppointmentId = null;
                
            } catch (error) {
                log('buttonResults', `❌ Complete work error: ${error.message}`, 'error');
            }
        }

        // Auto-login on page load
        window.addEventListener('load', () => {
            log('authStatus', '🚀 Ready to test button functionality', 'info');
        });
    </script>
</body>
</html>
