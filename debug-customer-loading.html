<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Customer Loading</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>🔍 Debug Customer Loading Issue</h1>
    
    <button onclick="testCustomerAPI()">Test Customer API Call</button>
    <div id="result" class="result"></div>
    
    <h2>Instructions:</h2>
    <ol>
        <li>Click the button above to test the customer API</li>
        <li>Check the console for detailed logs</li>
        <li>Compare the response structure with what the modal expects</li>
    </ol>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        async function testCustomerAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing customer API...';
            
            try {
                // Get token from localStorage (assuming user is logged in)
                const token = localStorage.getItem('token');
                if (!token) {
                    throw new Error('No authentication token found. Please log in first.');
                }
                
                resultEl.textContent += '\nMaking API call to /shop/customers/...';
                
                const response = await fetch(`${API_BASE}/shop/customers/?limit=10`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultEl.className = 'result success';
                resultEl.textContent += '\n✅ Raw API Response:';
                resultEl.textContent += '\n' + JSON.stringify(data, null, 2);
                
                // Test the service transformation logic
                const customerList = data.results || data.customers || (Array.isArray(data) ? data : []);
                resultEl.textContent += '\n\n📋 Extracted customer list:';
                resultEl.textContent += '\nCount: ' + customerList.length;
                
                if (customerList.length > 0) {
                    resultEl.textContent += '\nFirst customer structure:';
                    resultEl.textContent += '\n' + JSON.stringify(customerList[0], null, 2);
                    
                    // Test the mapping that the service would do
                    const mappedCustomer = {
                        id: customerList[0].id?.toString() || '',
                        name: customerList[0].name || '',
                        email: customerList[0].email || '',
                        phone: customerList[0].phone || ''
                    };
                    
                    resultEl.textContent += '\n\nMapped customer (what service returns):';
                    resultEl.textContent += '\n' + JSON.stringify(mappedCustomer, null, 2);
                }
                
            } catch (error) {
                resultEl.className = 'result error';
                resultEl.textContent += '\n❌ Error: ' + error.message;
                console.error('Customer API test error:', error);
            }
        }
    </script>
</body>
</html>
