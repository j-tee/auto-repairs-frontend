<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments API Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Appointments API Debug Tool</h1>
    
    <div class="section">
        <h3>Authentication Test</h3>
        <button onclick="testAuth()">Test Authentication</button>
        <pre id="authResult"></pre>
    </div>
    
    <div class="section">
        <h3>Appointments API Test</h3>
        <button onclick="testAppointments()">Test Appointments API</button>
        <pre id="appointmentsResult"></pre>
    </div>
    
    <div class="section">
        <h3>Raw API Response</h3>
        <pre id="rawResponse"></pre>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let authToken = localStorage.getItem('auth_token');
        
        document.getElementById('authResult').textContent = 
            `Current token: ${authToken ? authToken.substring(0, 20) + '...' : 'None'}`;

        async function testAuth() {
            const resultEl = document.getElementById('authResult');
            
            try {
                // Try different auth field combinations
                const authTests = [
                    { email: 'owner@autorepairshop.com', password: 'password123' },
                    { username: 'owner@autorepairshop.com', password: 'password123' },
                    { email: 'admin@autorepairshop.com', password: 'password123' },
                    { username: 'admin', password: 'password123' }
                ];
                
                for (const credentials of authTests) {
                    resultEl.textContent += `\\n\\nTrying: ${JSON.stringify(credentials)}`;
                    
                    const response = await fetch(`${API_BASE}/token/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(credentials)
                    });
                    
                    const result = await response.text();
                    resultEl.textContent += `\\nStatus: ${response.status}`;
                    resultEl.textContent += `\\nResponse: ${result}`;
                    
                    if (response.ok) {
                        const data = JSON.parse(result);
                        if (data.access) {
                            authToken = data.access;
                            localStorage.setItem('auth_token', authToken);
                            resultEl.textContent += `\\n✅ SUCCESS! Token obtained.`;
                            break;
                        }
                    }
                }
            } catch (error) {
                resultEl.textContent += `\\n❌ Error: ${error.message}`;
            }
        }
        
        async function testAppointments() {
            const resultEl = document.getElementById('appointmentsResult');
            const rawEl = document.getElementById('rawResponse');
            
            try {
                resultEl.textContent = 'Testing appointments endpoint...';
                
                // Test without auth first
                resultEl.textContent += '\\n\\n1. Testing without authentication:';
                let response = await fetch(`${API_BASE}/shop/appointments/?limit=10`);
                resultEl.textContent += `\\nStatus: ${response.status}`;
                let text = await response.text();
                resultEl.textContent += `\\nResponse: ${text}`;
                
                // Test with auth token
                if (authToken) {
                    resultEl.textContent += '\\n\\n2. Testing with authentication:';
                    response = await fetch(`${API_BASE}/shop/appointments/?limit=10`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    resultEl.textContent += `\\nStatus: ${response.status}`;
                    text = await response.text();
                    resultEl.textContent += `\\nResponse length: ${text.length} chars`;
                    
                    rawEl.textContent = text;
                    
                    if (response.ok) {
                        try {
                            const data = JSON.parse(text);
                            resultEl.textContent += `\\n✅ SUCCESS!`;
                            resultEl.textContent += `\\nData type: ${Array.isArray(data) ? 'Array' : typeof data}`;
                            if (Array.isArray(data)) {
                                resultEl.textContent += `\\nArray length: ${data.length}`;
                            } else if (data.results) {
                                resultEl.textContent += `\\nResults length: ${data.results.length}`;
                                resultEl.textContent += `\\nTotal count: ${data.count}`;
                            }
                        } catch (e) {
                            resultEl.textContent += `\\n❌ JSON Parse Error: ${e.message}`;
                        }
                    }
                } else {
                    resultEl.textContent += '\\n\\n❌ No auth token available. Run auth test first.';
                }
                
            } catch (error) {
                resultEl.textContent += `\\n❌ Error: ${error.message}`;
            }
        }
        
        // Auto-test on load
        window.onload = () => {
            if (authToken) {
                testAppointments();
            }
        };
    </script>
</body>
</html>
