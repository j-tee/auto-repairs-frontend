<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Appointment Modal Customer Loading</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Appointment Modal Customer Loading Test</h1>
    
    <div class="section">
        <h2>Step 1: Test Authentication</h2>
        <button onclick="testLogin()">Test Login with Owner Credentials</button>
        <div id="auth-result" class="result"></div>
    </div>
    
    <div class="section">
        <h2>Step 2: Test Customer API</h2>
        <button onclick="testCustomerAPI()">Test Customer API Call</button>
        <div id="customer-result" class="result"></div>
    </div>
    
    <div class="section">
        <h2>Step 3: Test Full Modal Flow</h2>
        <button onclick="openMainApp()">Open Main App to Test Modal</button>
        <p>After clicking above, go to the dashboard and try to schedule an appointment.</p>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let authToken = null;

        async function testLogin() {
            const resultEl = document.getElementById('auth-result');
            resultEl.textContent = 'Testing authentication...';
            
            try {
                // Test with owner credentials
                const credentials = { 
                    email: 'owner@autorepairs.com', 
                    password: 'owner123' 
                };
                
                resultEl.textContent += `\nTrying credentials: ${JSON.stringify(credentials)}`;
                
                const response = await fetch(`${API_BASE}/token/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                authToken = data.access;
                
                // Store token in localStorage (like the real app does)
                localStorage.setItem('token', authToken);
                localStorage.setItem('refreshToken', data.refresh);
                
                resultEl.className = 'result success';
                resultEl.textContent += `\n✅ Authentication successful!`;
                resultEl.textContent += `\nToken: ${authToken ? authToken.substring(0, 20) + '...' : 'None'}`;
                resultEl.textContent += `\nUser Role: ${data.user?.role || 'Unknown'}`;
                
            } catch (error) {
                resultEl.className = 'result error';
                resultEl.textContent += `\n❌ Authentication failed: ${error.message}`;
                console.error('Auth error:', error);
            }
        }

        async function testCustomerAPI() {
            const resultEl = document.getElementById('customer-result');
            resultEl.textContent = 'Testing customer API...';
            
            try {
                if (!authToken) {
                    throw new Error('Please authenticate first (click Test Login)');
                }
                
                resultEl.textContent += '\nMaking API call to /shop/customers/...';
                
                const response = await fetch(`${API_BASE}/shop/customers/?limit=10`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultEl.className = 'result success';
                resultEl.textContent += `\n✅ Customer API call successful!`;
                resultEl.textContent += `\nTotal customers: ${data.count || data.total || 'Unknown'}`;
                resultEl.textContent += `\nFirst 3 customers:`;
                
                const customers = data.results || data.customers || [];
                customers.slice(0, 3).forEach((customer, index) => {
                    resultEl.textContent += `\n  ${index + 1}. ${customer.name} (${customer.email})`;
                });
                
                if (customers.length === 0) {
                    resultEl.textContent += '\n⚠️ No customers found in database';
                }
                
            } catch (error) {
                resultEl.className = 'result error';
                resultEl.textContent += `\n❌ Customer API failed: ${error.message}`;
                console.error('Customer API error:', error);
            }
        }

        function openMainApp() {
            // Open the main app in a new tab
            window.open('http://localhost:5174/', '_blank');
        }

        // Check if there's already a token in localStorage
        window.onload = function() {
            const existingToken = localStorage.getItem('token');
            if (existingToken) {
                authToken = existingToken;
                document.getElementById('auth-result').textContent = `Found existing token: ${existingToken.substring(0, 20)}...`;
                document.getElementById('auth-result').className = 'result success';
            }
        };
    </script>
</body>
</html>
