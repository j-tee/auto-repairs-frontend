<!DOCTYPE html>
<html>
<head>
    <title>Clear Auth and Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Fix Authentication Issue</h1>
    
    <div class="section">
        <h2>Step 1: Clear Bad Tokens</h2>
        <button onclick="clearAuth()">Clear All Auth Data</button>
        <div id="clearResult"></div>
    </div>
    
    <div class="section">
        <h2>Step 2: Login Fresh</h2>
        <button onclick="loginFresh()">Login with Owner Credentials</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section">
        <h2>Step 3: Test API</h2>
        <button onclick="testAPI()">Test Appointments API</button>
        <div id="apiResult"></div>
    </div>

    <script>
        function clearAuth() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('user');
            localStorage.clear(); // Clear everything to be sure
            
            document.getElementById('clearResult').innerHTML = 
                '<div class="success">✅ All auth data cleared from localStorage</div>';
        }
        
        async function loginFresh() {
            const resultDiv = document.getElementById('loginResult');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'owner@autorepairshop.com',
                        password: 'owner123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('auth_token', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    
                    resultDiv.innerHTML = 
                        '<div class="success">✅ Login successful! New tokens saved.</div>';
                } else {
                    resultDiv.innerHTML = 
                        `<div class="error">❌ Login failed: ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = 
                    `<div class="error">❌ Login error: ${error.message}</div>`;
            }
        }
        
        async function testAPI() {
            const resultDiv = document.getElementById('apiResult');
            const token = localStorage.getItem('auth_token');
            
            if (!token) {
                resultDiv.innerHTML = 
                    '<div class="error">❌ No token found. Please login first.</div>';
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/shop/appointments/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = 
                        `<div class="success">✅ API test successful! Found ${data.count || 0} appointments</div>`;
                } else {
                    resultDiv.innerHTML = 
                        `<div class="error">❌ API test failed: ${response.status} - ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = 
                    `<div class="error">❌ API test error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
